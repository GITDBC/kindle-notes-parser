name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  PLATFORM: Linux x86_64
  TARGET: x86_64-unknown-linux-gnu
  ARTIFACT_NAME: knp
  ASSET_NAME: knp-linux-x86_64

jobs:
  build-cli:
    name: Build KNP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key:
            ${{ runner.os }}-${{ env.TARGET }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.TARGET }}-cargo-

      - name: Build Release Binary
        run: cargo build --release --target ${{ env.TARGET }} --verbose

      - name: Rename Binary
        run:
          mv target/${{ env.TARGET }}/release/${{ env.ARTIFACT_NAME }} ${{
          env.ASSET_NAME }}
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_NAME }}

  release:
    name: Release
    needs: build-cli
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Resolve Version and Check Tag
        id: get-version
        run: |
          version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "::notice::Tag $tag already exists, skipping release"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Artifacts
        if: steps.get-version.outputs.exists == 'false'
        uses: actions/download-artifact@v8

      - name: Create Tag and Release
        if: steps.get-version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            **/knp-*
